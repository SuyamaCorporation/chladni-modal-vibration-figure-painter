<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>クラドニ図形 モーダル振動ペインター</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen flex flex-col items-center p-4">
<h1 class="text-2xl font-bold mb-1 text-center">🎵 クラドニ図形</h1>
<p class="text-gray-400 text-sm mb-3 text-center">プレートの振動モードで生まれる砂の節線パターン</p>
<canvas id="c" class="rounded-xl shadow-2xl mb-4" style="max-width:100%"></canvas>
<div class="flex flex-wrap gap-4 justify-center mb-4">
  <label class="flex flex-col items-center text-xs text-gray-300">
    節線数 m (横)
    <input type="range" id="m" min="0" max="8" value="2" class="w-32 mt-1">
    <span id="mVal" class="font-mono text-yellow-300 mt-1">2</span>
  </label>
  <label class="flex flex-col items-center text-xs text-gray-300">
    節線数 n (縦)
    <input type="range" id="n" min="0" max="8" value="3" class="w-32 mt-1">
    <span id="nVal" class="font-mono text-yellow-300 mt-1">3</span>
  </label>
  <label class="flex flex-col items-center text-xs text-gray-300">
    閾値
    <input type="range" id="thresh" min="0.01" max="0.3" step="0.01" value="0.08" class="w-32 mt-1">
    <span id="threshVal" class="font-mono mt-1">0.08</span>
  </label>
  <label class="flex flex-col items-center text-xs text-gray-300">
    カラー
    <select id="cmode" class="mt-1 bg-gray-800 border border-gray-600 rounded px-2 py-1 text-sm">
      <option value="sand">砂</option>
      <option value="heat">ヒート</option>
      <option value="plasma">プラズマ</option>
      <option value="mono">モノクロ</option>
    </select>
  </label>
</div>
<div id="freq" class="text-sm text-gray-400 font-mono mb-2"></div>
<button id="animBtn" class="bg-purple-700 hover:bg-purple-600 px-6 py-2 rounded-lg font-bold transition mb-3">🎬 モードを順に表示</button>
<script>
const cv=document.getElementById('c');
const ctx=cv.getContext('2d');
let W;
function resize(){
  W=cv.width=cv.height=Math.min(window.innerWidth-32,500);
  draw();
}
resize();

let animRunning=false,animId;

function draw(){
  const m=parseInt(document.getElementById('m').value);
  const n=parseInt(document.getElementById('n').value);
  const thresh=parseFloat(document.getElementById('thresh').value);
  const cmode=document.getElementById('cmode').value;
  const img=ctx.createImageData(W,W);
  const data=img.data;

  for(let py=0;py<W;py++){
    for(let px=0;px<W;px++){
      const x=(px/W-0.5)*2*Math.PI;
      const y=(py/W-0.5)*2*Math.PI;
      const v=Math.cos(m*x)*Math.cos(n*y)-Math.cos(n*x)*Math.cos(m*y);
      const absV=Math.abs(v);
      let r=0,g=0,b=0,a=255;
      if(absV<thresh){
        // On node line (sand accumulates here)
        const t=1-absV/thresh;
        switch(cmode){
          case 'sand': r=220+t*35|0; g=200+t*20|0; b=140+t*30|0; break;
          case 'heat': r=255; g=t*200|0; b=0; break;
          case 'plasma': r=200+t*55|0; g=0; b=200+t*55|0; break;
          default: r=g=b=200+t*55|0;
        }
      } else {
        // Background
        switch(cmode){
          case 'sand': r=20;g=20;b=30; break;
          case 'heat': r=10;g=5;b=5; break;
          case 'plasma': r=5;g=5;b=15; break;
          default: r=g=b=10;
        }
      }
      const idx=(py*W+px)*4;
      data[idx]=r;data[idx+1]=g;data[idx+2]=b;data[idx+3]=a;
    }
  }
  ctx.putImageData(img,0,0);
  const freq=Math.round((m*m+n*n)*50);
  document.getElementById('freq').textContent=`モード (m=${m}, n=${n}) | 固有振動数 ∝ ${m}²+${n}²=${m*m+n*n} | 参考周波数 ~${freq} Hz`;
}

['m','n'].forEach(id=>{
  document.getElementById(id).addEventListener('input',e=>{
    document.getElementById(id+'Val').textContent=e.target.value;
    draw();
  });
});
document.getElementById('thresh').addEventListener('input',e=>{
  document.getElementById('threshVal').textContent=parseFloat(e.target.value).toFixed(2);
  draw();
});
document.getElementById('cmode').addEventListener('change',draw);

let animM=0,animN=0;
document.getElementById('animBtn').addEventListener('click',()=>{
  if(animRunning){
    clearInterval(animId); animRunning=false;
    document.getElementById('animBtn').textContent='🎬 モードを順に表示';
  } else {
    animRunning=true;
    document.getElementById('animBtn').textContent='⏹ 停止';
    animM=0; animN=0;
    animId=setInterval(()=>{
      animN++;
      if(animN>6){ animN=0; animM++; }
      if(animM>6){ animM=0; animN=0; }
      document.getElementById('m').value=animM;
      document.getElementById('n').value=animN;
      document.getElementById('mVal').textContent=animM;
      document.getElementById('nVal').textContent=animN;
      draw();
    },800);
  }
});
draw();
</script>
</body>
</html>
